name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: CLI smoke test
        run: |
          node bin/skills-cli.mjs list
          node bin/skills-cli.mjs path
          node bin/skills-cli.mjs add --all --target /tmp/skills-smoke
          test -f /tmp/skills-smoke/block-pattern/SKILL.md
      - name: npm pack (verify publishable)
        run: npm pack --dry-run
